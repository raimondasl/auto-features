[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reporadar"
version = "1.0.0"
description = "Monitor arXiv for papers relevant to your repo and produce a weekly Markdown digest."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "jinja2>=3.1",
    "arxiv>=2.0",
]

[project.scripts]
rr = "reporadar.cli:cli"

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=2.0",
]
evals = [
    # Only needed for the Tier B LLM-judge benchmark (evals/run_judge_eval.py).
    "openai>=1.0",  # the neutral judge
    "anthropic>=0.40",  # the --baseline api Opus + web_search baseline
]
mcp = [
    # Only needed for `rr mcp` (RepoRadar as an MCP server for coding agents).
    "mcp>=1.0",
]
vectors = [
    # Optional acceleration for `rr search --semantic` on large corpora. The
    # feature works without it (numpy fallback); this backs KNN with a vec0 index.
    "sqlite-vec>=0.1",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reporadar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The eval harness (evals/) imports its own modules top-level (script-dir style),
# so put it on the path to let tests import baseline/verify directly.
pythonpath = ["evals"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["arxiv", "sklearn.*", "yaml", "sentence_transformers", "mcp.*", "sqlite_vec"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# FastMCP's `@server.tool()` decorator is untyped (external SDK), which trips
# strict's untyped-decorator check on the tool bodies; the bodies just delegate
# to already-typed helpers in this module.
module = ["reporadar.mcp_server"]
disallow_untyped_decorators = false
