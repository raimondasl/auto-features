[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The distribution name is not "reporadar": PyPI refuses that name. Its similarity check
# ultranormalizes candidates -- strips ". _ -", folds l/L/i/I to 1 and o/O to 0 -- and under that
# rule "reporadar" and the existing, unrelated "repo-radar" (a GitHub pull-request auditing
# toolkit) are the same string. No spelling escapes it: "repo_radar", "RepoRadar" and "rep0radar"
# all collapse to the same thing, and acquiring "repo-radar" would not help either, because the
# check matches any project rather than only other people's. The "-papers" suffix is what does the
# disambiguating work, on the axis where the two products actually differ: repo-radar audits pull
# requests, this recommends papers.
#
# Only the distribution name moves. The import package is still "reporadar" and the command is
# still "rr" -- see [tool.hatch.build.targets.wheel] and [project.scripts]. This is the same split
# as beautifulsoup4/bs4.
name = "reporadar-papers"
version = "1.0.1"
# "relevant to your repo" is the framing this project exists to argue against — the paper is
# titled "From Relevance to Actionability", and the whole system is built around a utility
# judgment that a topical-relevance tool does not make. That sentence was the first thing a
# reader would have seen on PyPI, describing a different tool.
description = "Recommend research papers a code repository should act on, and nothing when none qualify."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "raimondasl" }]
keywords = ["arxiv", "research", "recommendation", "repository", "llm", "digest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Documentation",
]

dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "jinja2>=3.1",
    "arxiv>=2.0",
]

[project.urls]
Homepage = "https://github.com/raimondasl/auto-features"
Repository = "https://github.com/raimondasl/auto-features"
Issues = "https://github.com/raimondasl/auto-features/issues"

[project.scripts]
rr = "reporadar.cli:cli"

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=2.0",
]
hyde = [
    # HyDE dense discovery (`rr sync-index` + `hyde.enabled`). The encoder must be the
    # one the published index was built with, or queries land in a different space —
    # `reporadar.hyde.verify_encoder` refuses to search unless vectors match bit-for-bit.
    "sentence-transformers>=2.0",
    # Reads two columns out of remote Parquet shards over HTTP Range, which is what
    # turns a 2,542 MB dataset into a 432 MB one-time sync.
    "pyarrow>=15",
]
evals = [
    # Only needed for the Tier B LLM-judge benchmark (evals/run_judge_eval.py).
    "openai>=1.0",  # the neutral judge
    "anthropic>=0.40",  # the --baseline api Opus + web_search baseline
    # P2's stemmed BM25 arm. The shipped retrieval.py tokenizer is unstemmed, and the
    # gap-phrase failure it targets is largely morphological: "experience replay
    # prioritization methods" vs "prioritized experience replay" share no exact token,
    # but stem to the same terms.
    "snowballstemmer>=2.2",
    # P4 reads one column out of a remote Parquet shard over HTTP Range, to check
    # whether Design 2's "columnar range-fetch" is real before anything is built on
    # it. Nothing in src/reporadar imports it.
    "pyarrow>=15",
]
mcp = [
    # Only needed for `rr mcp` (RepoRadar as an MCP server for coding agents).
    #
    # Upper-bounded deliberately. mcp 2.x renamed FastMCP to MCPServer and dropped
    # `mcp.server.fastmcp`, which `reporadar.mcp_server.build_server` imports -- so an
    # unbounded `mcp>=1.0` resolves to 2.x and `rr mcp` cannot start at all. uv.lock hid
    # this completely: the dev venv and CI both pin a working 1.x, so only a user doing a
    # fresh resolve ever saw it, and the published plugin could not start for anyone.
    # Lift the bound when build_server is ported to MCPServer, not before.
    "mcp>=1.0,<2",
]
vectors = [
    # Optional acceleration for `rr search --semantic` on large corpora. The
    # feature works without it (numpy fallback); this backs KNN with a vec0 index.
    "sqlite-vec>=0.1",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reporadar"]

# The sdist had no target, so hatchling swept the repository: 598 files, 16.3 MB unpacked,
# including the 3.4 MB candidate universe, the walk ledger, the judge-validity datasheet and a
# 0.6 MB RESULTS.md. Everyone running `pip install reporadar-papers` would have downloaded a
# corpus to get a CLI. The wheel was already scoped and looked fine, which is why this went
# unnoticed — the two targets fail independently.
#
# Explicit allow-list rather than exclusions: a new top-level directory should be absent from
# the sdist until somebody adds it deliberately, not present until somebody remembers to
# exclude it.
[tool.hatch.build.targets.sdist]
include = [
    "/src/reporadar",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The eval harness (evals/) imports its own modules top-level (script-dir style),
# so put it on the path to let tests import baseline/verify directly.
pythonpath = ["evals"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "arxiv",
    "sklearn.*",
    "yaml",
    "sentence_transformers",
    "mcp.*",
    "sqlite_vec",
    "pyarrow.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# FastMCP's `@server.tool()` decorator is untyped (external SDK), which trips
# strict's untyped-decorator check on the tool bodies; the bodies just delegate
# to already-typed helpers in this module.
module = ["reporadar.mcp_server"]
disallow_untyped_decorators = false
