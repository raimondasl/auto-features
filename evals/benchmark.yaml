    # the 300 characters the gate and HyDE are told the project IS; keywords are CLI
    # flags (`fa`, `fq`, `aln`, `ax`) and `python` ranks #2 off the setup.py blurb.
    # Literature: 3 of 7 hand-made targets on arXiv, 4 of 7 bioRxiv-only (§4).
    repo_dir: repos/bio-align
    live_repo: https://github.com/lh3/minimap2
    expected_categories: [q-bio.GN, q-bio.QM, cs.DS]
    gold_queries:
      - long read sequence alignment algorithm
      - minimizer seeding sketching sequence search
      - splice aware read mapping transcriptome
      - nanopore read mapping error tolerant
      - pairwise whole genome alignment
    distractor_queries:
      - vectorized query execution database
      - web application routing framework
      - speech recognition acoustic model
    gold_n: 12
    distractor_n: 24

