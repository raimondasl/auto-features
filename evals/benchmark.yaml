  # ---------------------------------------------------------------------------
  # Cohort 2 (2026-08-05) — added because the original 12 were measurably too
  # narrow, not as a general "more data is better" gesture.
  #
  # Jackknifing P1's headline showed that removing ONE repo (`rag`, which holds
  # 5 of 18 targets in the smallest pool) moved the leave-one-out result from a
  # 70% pool cut to 11%. Effective repo count over target share was 5.4 of 7. A
  # result one repo can move 59 points is a property of the set, not of the
  # mechanism under test.
  #
  # These ten close four *named* blind spots rather than adding more of the same.
  # The measured criteria table is in evals/README.md.
  #   T = thin/operational docs (RepoRadar's real target user; all 12 originals
  #       are popular OSS with maintained READMEs, so the shipped
  #       `profiler.prose_chars: 300` default may be an artifact of that)
  #   B = no arXiv bibliography (structural zero for the citation hop; only
  #       crypto+systems had this, too few to measure P3's synthetic seeding)
  #   N = non-ML domain (8 of the original 12 are ML)
  #   C = citation-rich: cites papers AND is cited by them (P6 adoption truth)
  # ---------------------------------------------------------------------------

