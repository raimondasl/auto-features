  # ---------------------------------------------------------------------------
  # COHORT 3 — scientific software (added 2026-08-19, pre-registered in
  # RESEARCH-scientific-software.md §14). Six bioinformatics, six materials
  # science, all twelve drawn from the nineteen repositories scouted in §4 of
  # that document, so the population was fixed before any of them was judged.
  #
  # Every one is N (non-ML domain). None is T: the thinnest README here is
  # OpenMM's at 2,232 characters, against the 1,232-1,689 of the thin-* cases —
  # scientific software is documented, it is just documented in `doc/` and in
  # reStructuredText, which is what §10-§11 were about. Nine of twelve are C
  # (they cite arXiv papers AND are cited by them), so the citation hop has
  # something to work with here, unlike crypto and systems.
  #
  # PROFILE STRATUM, assigned from the profiles measured on 2026-08-19 and
  # written down BEFORE any paper was judged, because "which cases did well"
  # is not a question that may be answered after seeing the answer:
  #   clean     — subject words dominate the keywords and the prose is a real
  #               description of the project
  #   polluted  — subject words present, with a named defect alongside them
  #   defective — the profile does not describe the project
  # The per-stratum predictions are in §14. Cases were NOT selected for having
  # a good profile; `mat-featurize` and `bio-align` are in precisely because
  # they are the two worst, and dropping them would flatter the mean.
  # ---------------------------------------------------------------------------

  - name: bio-align
    description: Long-read sequence aligner (minimizer seeding, splice-aware mapping)
