# RepoRadar evaluation benchmark.
#
# Each case pairs a realistic repo profile with a labeled pool of arXiv papers.
# - offline mode: profiles `repo_dir` and ranks the frozen pool in fixtures/<name>.json
# - live mode:    clones `live_repo`, runs the full pipeline against real sources
#
# Fixtures are generated by build_fixtures.py using the gold_queries (relevant,
# label 1) and distractor_queries (irrelevant, label 0). Gold papers come from
# the case's own domain; distractors come from clearly different fields, so the
# eval measures whether the ranker separates on-topic from off-topic papers
# given a realistic repo profile.

k: 10 # cutoff for precision@k / recall@k / ndcg@k

cases:
  - name: rag
    description: Retrieval-augmented generation / neural IR library
    repo_dir: repos/rag
    live_repo: https://github.com/stanford-futuredata/ColBERT
    expected_categories: [cs.CL, cs.IR, cs.LG]
    gold_queries:
      - retrieval augmented generation
      - dense passage retrieval
      - neural information retrieval
      - open domain question answering
      - late interaction retrieval
    distractor_queries:
      - object detection convolutional
      - reinforcement learning robot locomotion
      - protein structure prediction
    gold_n: 12
    distractor_n: 24

  - name: cv
    description: Computer-vision / object-detection library
    repo_dir: repos/cv
    live_repo: https://github.com/facebookresearch/detectron2
    expected_categories: [cs.CV]
    gold_queries:
      - object detection
      - semantic segmentation
      - vision transformer image classification
      - instance segmentation
    distractor_queries:
      - retrieval augmented generation language model
      - reinforcement learning policy gradient
      - named entity recognition
    gold_n: 12
    distractor_n: 24

  - name: rl
    description: Deep reinforcement-learning library
    repo_dir: repos/rl
    live_repo: https://github.com/DLR-RM/stable-baselines3
    expected_categories: [cs.LG, cs.AI]
    gold_queries:
      - deep reinforcement learning
      - policy gradient methods
      - off-policy actor critic
      - proximal policy optimization
    distractor_queries:
      - object detection image
      - retrieval augmented generation
      - machine translation transformer
    gold_n: 12
    distractor_n: 24

  # Negative control: a web framework has almost no arXiv research overlap.
  # A good ranker should NOT flag ML papers as highly relevant to it.
  - name: webdev
    description: Web application framework (negative control — expect low relevance)
    repo_dir: repos/webdev
    live_repo: https://github.com/pallets/flask
    expected_categories: [] # no expected research categories
    negative_control: true
    max_score_threshold: 0.5 # top score should stay below the "Top Pick" tier
    gold_queries: [] # no gold papers exist for this domain
    distractor_queries:
      - large language models
      - object detection
      - reinforcement learning
      - graph neural networks
    gold_n: 0
    distractor_n: 30

  # ── Expansion set (added 2026-07-12) ──────────────────────────────────────
  # Broadens beyond the original 3-ML-plus-control set for statistical power and
  # domain coverage. These are wired for Tier B (live, LLM-judged) immediately —
  # it only needs `live_repo` + `expected_categories`. Tier A (offline) fixtures
  # are NOT generated yet; run `build_fixtures.py` before using these offline.

  # More ML — arXiv-rich domains where RepoRadar should surface actionable work.
  - name: peft
    description: Parameter-efficient fine-tuning library (LoRA, adapters, prompt tuning)
    repo_dir: repos/peft
    live_repo: https://github.com/huggingface/peft
    expected_categories: [cs.LG, cs.CL]
    gold_queries:
      - parameter efficient fine-tuning
      - low-rank adaptation LoRA
      - prompt tuning language models
      - quantized low-rank fine-tuning
      - adapter modules transfer learning
    distractor_queries:
      - object detection convolutional
      - reinforcement learning locomotion
      - protein structure prediction
    gold_n: 12
    distractor_n: 24

  - name: diffusion
    description: Diffusion models library for image and audio generation
    repo_dir: repos/diffusion
    live_repo: https://github.com/huggingface/diffusers
    expected_categories: [cs.CV, cs.LG]
    gold_queries:
      - denoising diffusion probabilistic models
      - latent diffusion text to image
      - score-based generative models
      - classifier-free guidance
      - diffusion model sampling schedulers
    distractor_queries:
      - reinforcement learning policy gradient
      - retrieval augmented generation
      - named entity recognition
    gold_n: 12
    distractor_n: 24

  - name: graph
    description: Graph neural network library
    repo_dir: repos/graph
    live_repo: https://github.com/pyg-team/pytorch_geometric
    expected_categories: [cs.LG]
    gold_queries:
      - graph neural networks
      - graph convolutional networks
      - message passing neural networks
      - graph attention networks
      - node classification link prediction
    distractor_queries:
      - object detection image
      - speech recognition transformer
      - machine translation
    gold_n: 12
    distractor_n: 24

  - name: speech
    description: Automatic speech recognition (Whisper)
    repo_dir: repos/speech
    live_repo: https://github.com/openai/whisper
    expected_categories: [eess.AS, cs.CL, cs.SD]
    gold_queries:
      - automatic speech recognition
      - end-to-end speech transcription
      - self-supervised speech representation learning
      - multilingual speech recognition
      - audio encoder transformer
    distractor_queries:
      - object detection
      - graph neural network
      - reinforcement learning
    gold_n: 12
    distractor_n: 24

  # Research-adjacent but NOT on arXiv — real fields whose literature lives on
  # IACR ePrint / VLDB / OSDI. A well-behaved RepoRadar should mostly abstain
  # here (like webdev, but with adjacent research that genuinely exists).
  - name: crypto
    description: Cryptography library (research lives on IACR ePrint, thin on arXiv)
    repo_dir: repos/crypto
    live_repo: https://github.com/pyca/cryptography
    expected_categories: [cs.CR]
    gold_queries:
      - authenticated encryption
      - elliptic curve cryptography
      - post-quantum cryptography
      - constant-time side-channel resistant implementation
      - key derivation functions
    distractor_queries:
      - object detection
      - reinforcement learning
      - retrieval augmented generation
    gold_n: 8
    distractor_n: 24

  - name: systems
    description: In-memory data store (systems research lives at VLDB/OSDI, thin on arXiv)
    repo_dir: repos/systems
    live_repo: https://github.com/redis/redis
    expected_categories: [cs.DB, cs.DC]
    gold_queries:
      - in-memory key-value store
      - log-structured storage engine
      - distributed consensus replication
      - concurrent lock-free data structures
      - cache eviction policies
    distractor_queries:
      - object detection
      - language model fine-tuning
      - reinforcement learning
    gold_n: 8
    distractor_n: 24

  # More negative controls — pure-engineering repos with no research to apply.
  # Tests abstention robustness beyond the single webdev control.
  - name: cli
    description: Command-line interface framework (negative control — pure engineering)
    repo_dir: repos/cli
    live_repo: https://github.com/pallets/click
    expected_categories: []
    negative_control: true
    max_score_threshold: 0.5
    gold_queries: []
    distractor_queries:
      - large language models
      - object detection
      - reinforcement learning
      - graph neural networks
    gold_n: 0
    distractor_n: 30

  - name: http
    description: HTTP client library (negative control — pure engineering)
    repo_dir: repos/http
    live_repo: https://github.com/psf/requests
    expected_categories: []
    negative_control: true
    max_score_threshold: 0.5
    gold_queries: []
    distractor_queries:
      - large language models
      - object detection
      - reinforcement learning
      - diffusion models
    gold_n: 0
    distractor_n: 30
