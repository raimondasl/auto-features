# RepoRadar evaluation benchmark.
#
# Each case pairs a realistic repo profile with a labeled pool of arXiv papers.
# - offline mode: profiles `repo_dir` and ranks the frozen pool in fixtures/<name>.json
# - live mode:    clones `live_repo`, runs the full pipeline against real sources
#
# Fixtures are generated by build_fixtures.py using the gold_queries (relevant,
# label 1) and distractor_queries (irrelevant, label 0). Gold papers come from
# the case's own domain; distractors come from clearly different fields, so the
# eval measures whether the ranker separates on-topic from off-topic papers
# given a realistic repo profile.

k: 10 # cutoff for precision@k / recall@k / ndcg@k

cases:
  - name: rag
    description: Retrieval-augmented generation / neural IR library
    repo_dir: repos/rag
    live_repo: https://github.com/stanford-futuredata/ColBERT
    expected_categories: [cs.CL, cs.IR, cs.LG]
    gold_queries:
      - retrieval augmented generation
      - dense passage retrieval
      - neural information retrieval
      - open domain question answering
      - late interaction retrieval
    distractor_queries:
      - object detection convolutional
      - reinforcement learning robot locomotion
      - protein structure prediction
    gold_n: 12
    distractor_n: 24

  - name: cv
    description: Computer-vision / object-detection library
    repo_dir: repos/cv
    live_repo: https://github.com/facebookresearch/detectron2
    expected_categories: [cs.CV]
    gold_queries:
      - object detection
      - semantic segmentation
      - vision transformer image classification
      - instance segmentation
    distractor_queries:
      - retrieval augmented generation language model
      - reinforcement learning policy gradient
      - named entity recognition
    gold_n: 12
    distractor_n: 24

  - name: rl
    description: Deep reinforcement-learning library
    repo_dir: repos/rl
    live_repo: https://github.com/DLR-RM/stable-baselines3
    expected_categories: [cs.LG, cs.AI]
    gold_queries:
      - deep reinforcement learning
      - policy gradient methods
      - off-policy actor critic
      - proximal policy optimization
    distractor_queries:
      - object detection image
      - retrieval augmented generation
      - machine translation transformer
    gold_n: 12
    distractor_n: 24

  # Negative control: a web framework has almost no arXiv research overlap.
  # A good ranker should NOT flag ML papers as highly relevant to it.
  - name: webdev
    description: Web application framework (negative control — expect low relevance)
    repo_dir: repos/webdev
    live_repo: https://github.com/pallets/flask
    expected_categories: [] # no expected research categories
    negative_control: true
    max_score_threshold: 0.5 # top score should stay below the "Top Pick" tier
    gold_queries: [] # no gold papers exist for this domain
    distractor_queries:
      - large language models
      - object detection
      - reinforcement learning
      - graph neural networks
    gold_n: 0
    distractor_n: 30

