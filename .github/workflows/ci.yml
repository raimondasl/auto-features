name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      # --locked fails the build if uv.lock is out of date with pyproject.toml.
      # Without it `uv sync` silently re-resolves in the runner, so the committed
      # lockfile is never validated — which is how it drifted for ~a month after
      # the `mcp`/`vectors` extras were added without a re-lock, while CI stayed
      # green. A committed lockfile that CI does not check is decoration.
      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Mypy (type check)
        run: uv run mypy src/reporadar

      - name: Pytest
        run: uv run pytest tests/ -q
