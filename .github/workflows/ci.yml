name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # Both actions targeted Node 20, which GitHub deprecated: the runner was forcing them
      # onto Node 24 and warning on every job. Cosmetic until the shim is removed, then a
      # hard failure. Both versions below are verified `using: node24`.
      - uses: actions/checkout@v7

      # Pinned to an exact version, unlike checkout above, and NOT by preference: astral-sh
      # stopped publishing floating major tags after v7 (which still points at v7.6.0 from
      # March 2026). There is no `v10` ref to track, so `@v10` would fail to resolve. Bump
      # this by editing the exact version; do not "tidy" it into a bare major.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      # --locked fails the build if uv.lock is out of date with pyproject.toml.
      # Without it `uv sync` silently re-resolves in the runner, so the committed
      # lockfile is never validated — which is how it drifted for ~a month after
      # the `mcp`/`vectors` extras were added without a re-lock, while CI stayed
      # green. A committed lockfile that CI does not check is decoration.
      # `evals` is here because tests/ imports the eval scripts directly (the hop-pool
      # and gold-cache guards load evals/*.py by path), so the runner needs whatever
      # those scripts import at module level. Installing only `dev` made that an
      # accident waiting for the next dependency: P2's stemmed-BM25 arm added
      # `snowballstemmer` to gap_match.py, and the first test to import a module that
      # imports gap_match failed with ModuleNotFoundError on all three Pythons.
      - name: Install dependencies
        run: uv sync --locked --extra dev --extra evals

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Mypy (type check)
        run: uv run mypy src/reporadar

      - name: Pytest
        run: uv run pytest tests/ -q
